name: WVS Corte - Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'wvs-android/**'
      - '.github/workflows/wvs-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK do executor
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK nao encontrado"; exit 1; }
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          echo "SDK pronto"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: wvs-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: WVS-Corte-Ajuste-Impressao-v09
          path: wvs-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
