name: WVS Corte - Gerar APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'wvs-android/**'
      - '.github/workflows/wvs-android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wvs-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: WVS-Corte-Android-USB-teste
          path: wvs-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error