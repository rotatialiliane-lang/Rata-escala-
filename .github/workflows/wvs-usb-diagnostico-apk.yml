name: WVS Teste USB - Diagnostico APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'wvs-usb-diagnostico/**'
      - '.github/workflows/wvs-usb-diagnostico-apk.yml'
permissions:
  contents: read
jobs:
  build-diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android 34
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de diagnostico
        working-directory: wvs-usb-diagnostico
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WVS-Teste-USB-Diagnostico
          path: wvs-usb-diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error